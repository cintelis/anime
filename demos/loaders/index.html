<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 4: Loading Animations / Anime.js</title>
  <style>
    :root { --bg: #111; --fg: #eee; --muted: #777; --a: #ff4b6e; --b: #5ce1e6; --c: #ffd166; --d: #a4ff4f; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; padding: 40px 5vw; }
    a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
    h1 { margin: 16px 0 8px; font-size: 32px; }
    p.sub { color: var(--muted); margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .tile { background: #1b1b1b; border-radius: 16px; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
    .tile label { color: var(--muted); font-size: 13px; }
    .stage { height: 100px; display: flex; align-items: center; justify-content: center; position: relative; width: 140px; }

    .dots { display: flex; gap: 10px; }
    .dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--b); }
    .eq { display: flex; gap: 6px; align-items: center; height: 70px; }
    .eq i { width: 10px; height: 70px; background: var(--d); border-radius: 5px; }
    .gridl { display: grid; grid-template-columns: repeat(4, 16px); gap: 6px; }
    .gridl i { width: 16px; height: 16px; background: var(--a); border-radius: 3px; }
    .ring svg { width: 90px; height: 90px; }
    .ring circle { fill: none; stroke: var(--c); stroke-width: 8; stroke-linecap: round; }
    .orbit i { position: absolute; width: 14px; height: 14px; border-radius: 50%; left: 50%; top: 50%; margin: -7px; }
    .bar { width: 140px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--a), var(--c)); transform-origin: left; }
    .pct { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .word { white-space: nowrap; font-size: 26px; font-weight: 800; letter-spacing: .1em; }
    .word span { display: inline-block; }
    .cube { width: 50px; height: 50px; background: var(--b); border-radius: 8px; }
  </style>
</head>
<body>
  <a class="back" href="../">&larr; All demos</a>
  <h1>Loading animations</h1>
  <p class="sub">Eight loaders, each a few lines of code.</p>

  <div class="grid">
    <div class="tile"><div class="stage"><div class="dots"><i></i><i></i><i></i></div></div><label>Bouncing dots</label></div>
    <div class="tile"><div class="stage"><div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><label>Equalizer</label></div>
    <div class="tile"><div class="stage"><div class="gridl"></div></div><label>Grid ripple</label></div>
    <div class="tile"><div class="stage ring"><svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="36" /></svg></div><label>Drawing ring</label></div>
    <div class="tile"><div class="stage orbit"><i style="background:var(--a)"></i><i style="background:var(--b)"></i><i style="background:var(--c)"></i><i style="background:var(--d)"></i></div><label>Orbiting dots</label></div>
    <div class="tile"><div class="stage" style="flex-direction:column;gap:14px"><div class="pct">0%</div><div class="bar"><i></i></div></div><label>Progress bar</label></div>
    <div class="tile"><div class="stage"><div class="word">LOADING</div></div><label>Wave text</label></div>
    <div class="tile"><div class="stage"><div class="cube"></div></div><label>Morphing square</label></div>
  </div>

  <script type="module">
    import { animate, createTimeline, stagger, svg, splitText, utils } from '../../dist/modules/index.js';

    // 1. Bouncing dots
    animate('.dots i', {
      y: [0, -24, 0], duration: 700, ease: 'inOutSine', loop: true, delay: stagger(120), loopDelay: 200,
    });

    // 2. Equalizer: random heights picked fresh on every loop
    animate('.eq i', {
      scaleY: () => utils.random(.15, 1, 2), duration: 300, ease: 'inOutQuad',
      loop: true, alternate: true, delay: stagger(60), onLoop: self => self.refresh(),
    });

    // 3. Grid ripple: stagger from the center of a 4x4 grid
    document.querySelector('.gridl').innerHTML = '<i></i>'.repeat(16);
    animate('.gridl i', {
      scale: [1, .2, 1], opacity: [1, .3, 1], duration: 1200, ease: 'inOutQuad', loop: true,
      delay: stagger(100, { grid: [4, 4], from: 'center' }),
    });

    // 4. Drawing ring: the visible stroke segment chases itself while the ring spins
    animate(svg.createDrawable('.ring circle'), {
      draw: ['0 0', '0 .75', '1 1'], duration: 1600, ease: 'inOutQuad', loop: true,
    });
    animate('.ring svg', { rotate: 360, duration: 2000, ease: 'linear', loop: true });

    // 5. Orbiting dots: each dot circles at the same speed, offset in time
    document.querySelectorAll('.orbit i').forEach((dot, i) => {
      const pos = { a: i / 4 * Math.PI * 2 };
      animate(pos, {
        a: pos.a + Math.PI * 2, duration: 1800, ease: 'inOutCubic', loop: true, delay: i * 90,
        onUpdate: () => utils.set(dot, { x: Math.cos(pos.a) * 36, y: Math.sin(pos.a) * 36 }),
      });
    });

    // 6. Progress bar with a fake, uneven loading pace, then restart
    const pct = { v: 0 };
    const $pct = document.querySelector('.pct');
    const update = () => {
      $pct.textContent = Math.round(pct.v) + '%';
      utils.set('.bar i', { scaleX: pct.v / 100 });
    };
    createTimeline({ loop: true, loopDelay: 600, onBegin: () => { pct.v = 0; } })
      .add(pct, { v: 35, duration: 600, ease: 'outQuad', onUpdate: update })
      .add(pct, { v: 60, duration: 900, ease: 'inOutQuad', onUpdate: update }, '+=300')
      .add(pct, { v: 100, duration: 500, ease: 'inQuad', onUpdate: update }, '+=400');

    // 7. Wave text: split into letters, each one rises in turn
    const { chars } = splitText('.word', { chars: true });
    animate(chars, {
      y: [0, -14, 0], color: ['#eeeeee', '#ffd166', '#eeeeee'],
      duration: 800, ease: 'inOutSine', loop: true, loopDelay: 400, delay: stagger(70),
    });

    // 8. Morphing square: a timeline of several shape steps
    createTimeline({ loop: true, defaults: { duration: 500, ease: 'inOutBack' } })
      .add('.cube', { rotate: 90, borderRadius: '50%' })
      .add('.cube', { scale: .5, backgroundColor: '#ff4b6e' })
      .add('.cube', { rotate: 180, borderRadius: '8px', scale: 1, backgroundColor: '#5ce1e6' });
  </script>
</body>
</html>
